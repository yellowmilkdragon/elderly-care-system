services:
  - type: web
    name: elderly-care-api
    runtime: java
    rootDir: backend
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/elderly-care-system-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 10000

  - type: web
    name: elderly-care-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://elderly-care-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
